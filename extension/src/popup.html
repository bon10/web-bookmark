<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>書架に納める</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="bar">
      <span class="seal" aria-hidden="true">栞</span>
      <h1>書架に納める</h1>
      <button type="button" id="open-options" class="ghost">設定</button>
    </header>

    <!-- 接続先が未設定のとき -->
    <section id="view-unconfigured" hidden>
      <p class="notice">接続先が未設定です。設定画面でアプリの URL と Supabase の情報を入れてください。</p>
      <button type="button" id="to-options" class="primary">設定を開く</button>
    </section>

    <!-- 未ログインのとき -->
    <form id="view-login" hidden>
      <label class="field">
        <span class="kicker">Email</span>
        <input type="email" id="email" required autocomplete="username" />
      </label>
      <label class="field">
        <span class="kicker">Password</span>
        <input type="password" id="password" required autocomplete="current-password" />
      </label>
      <p id="login-error" class="notice error" hidden></p>
      <button type="submit" id="sign-in" class="primary">ログイン</button>
    </form>

    <!-- 登録フォーム -->
    <form id="view-form" hidden>
      <div id="duplicate" class="notice warn" hidden>
        <p id="duplicate-head"></p>
        <ul id="duplicate-list" class="matches"></ul>
      </div>

      <label class="field">
        <span class="kicker">Title</span>
        <input type="text" id="title" required />
      </label>

      <label class="field">
        <span class="kicker">URL</span>
        <input type="url" id="url" required class="mono" />
      </label>

      <div class="field">
        <span class="kicker">Rating</span>
        <div id="rating" class="stars" role="group" aria-label="評価"></div>
      </div>

      <div class="field">
        <div class="field-head">
          <span class="kicker">Tags</span>
          <span id="tag-count" class="count"></span>
        </div>
        <div id="tag-box" class="tag-box">
          <input type="text" id="tag-input" placeholder="タグを入力（Enter で確定）" autocomplete="off" />
        </div>
        <ul id="tag-suggestions" class="suggestions" hidden></ul>
      </div>

      <div class="field">
        <div class="field-head">
          <span class="kicker">Thumbnails</span>
          <span id="thumb-count" class="count"></span>
        </div>
        <div class="actions">
          <button type="button" id="grab-frames" class="ghost" hidden>動画から静止画を抜く</button>
          <button type="button" id="grant-images" class="ghost" hidden>画像の取得を許可</button>
        </div>
        <p id="thumb-status" class="hint" hidden></p>
        <div id="thumbs" class="thumbs"></div>
      </div>

      <label class="field">
        <span class="kicker">Sort order</span>
        <input type="number" id="sort-order" placeholder="0" class="mono" />
      </label>

      <p id="form-error" class="notice error" hidden></p>
      <p id="form-done" class="notice done" hidden>納めました。</p>

      <div class="actions">
        <button type="submit" id="submit" class="primary">追加する</button>
        <button type="button" id="sign-out" class="ghost">ログアウト</button>
      </div>
    </form>

    <script type="module" src="popup.js"></script>
  </body>
</html>
